version: '3.8'

services:
  searxng:
    build: .
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    restart: unless-stopped
    networks:
      - searxng-network

networks:
  searxng-network:
    driver: bridge

